<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Experience</title>
    <link rel="stylesheet" href="../home.css">
    <link rel="stylesheet" href="exper.css">
</head>
<body>
    <div class="heading">
        <h1>Code Quest</h1>
        <p>Share your Experience</p> 
        <button><a href="../index.html">Home</a></button>
    </div>
    <div class="about_section">
        <p>You can help other by sharing, how your interview went</p>
        <p>Fill out the form below!</p>
    </div>
    <div class="form">
        <label for="full_name">Full Name</label>
        <input type="text" placeholder="Bob Alice" id="full_name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="alice_bob@gmail.com" required>
        <label for="company_name">Company Name</label>
        <input type="text" placeholder="Google" id="company_name" required>
        <label for="role">Applied for: </label>
        <input type="text" placeholder="Frontend Developer" required>
        <textarea id="text_area" placeholder="Share your detailed experiece here"></textarea>
        <button>Submit</button>
    </div>
</body>
</html>
